[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pastoral-collaboration"
version = "0.8.0"
description = "Spiritual Planet pastoral collaboration and governance system"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
