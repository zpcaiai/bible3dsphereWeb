[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discernment-pride"
version = "0.4.0"
description = "Spiritual Planet pride hypothesis system Batch 04"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
