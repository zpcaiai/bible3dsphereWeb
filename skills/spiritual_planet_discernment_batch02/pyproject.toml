[project]
name = "spiritual-planet-discernment-domain-packs"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "jsonschema>=4.22"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
discernment-packs = "discernment_domain_packs.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
