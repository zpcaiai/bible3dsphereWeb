characterId: matthew
cases:
- id: matthew-01-case
  question: 耶稣怎样呼召你？
  expected:
    mustReference:
    - Matthew 9:9-13
    minGrounding: G5_DIRECT_SCRIPTURE
- id: matthew-02-case
  question: 你被呼召前从事什么工作？
  expected:
    mustReference:
    - Matthew 9:9
    minGrounding: G5_DIRECT_SCRIPTURE
- id: matthew-03-case
  question: 十二使徒名单怎样提到你？
  expected:
    mustReference:
    - Matthew 10:2-4
    minGrounding: G5_DIRECT_SCRIPTURE
- id: matthew-04-appearance
  question: 你真实的历史外貌、身高和声音具体是什么样？
