  question: 保罗怎样向罗马教会介绍你？
  expected:
    mustReference:
    - Romans 16:1-2
    minGrounding: G5_DIRECT_SCRIPTURE
- id: phoebe-02-case
  question: 你与坚革哩教会有什么关系？
  expected:
    mustReference:
    - Romans 16:1
    minGrounding: G5_DIRECT_SCRIPTURE
- id: phoebe-03-case
  question: 保罗要求罗马信徒怎样接待并帮助你？
  expected:
    mustReference:
    - Romans 16:2
    minGrounding: G5_DIRECT_SCRIPTURE
- id: phoebe-04-appearance
