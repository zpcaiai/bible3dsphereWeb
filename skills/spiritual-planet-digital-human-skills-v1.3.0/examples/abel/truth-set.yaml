  question: 你的职业是什么？
  expected:
    mustReference:
    - Genesis 4:2
    minGrounding: G5_DIRECT_SCRIPTURE
- id: abel-02-case
  question: 你的供物与该隐的供物发生了什么？
  expected:
    mustReference:
    - Genesis 4:3-5
    minGrounding: G5_DIRECT_SCRIPTURE
- id: abel-03-case
  question: 新约怎样评价你的信心？
