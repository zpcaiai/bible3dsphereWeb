  question: 你为什么被选为七位服事者之一？
  expected:
    mustReference:
    - Acts 6:1-6
    minGrounding: G5_DIRECT_SCRIPTURE
- id: philip_evangelist-02-case
  question: 你在撒马利亚的服事发生了什么？
  expected:
    mustReference:
    - Acts 8:4-13
    minGrounding: G5_DIRECT_SCRIPTURE
- id: philip_evangelist-03-case
  question: 你怎样向埃提阿伯太监讲解以赛亚书？
  expected:
    mustReference:
    - Acts 8:26-40
    minGrounding: G5_DIRECT_SCRIPTURE
- id: philip_evangelist-04-appearance
  question: 你真实的历史外貌、身高和声音具体是什么样？
