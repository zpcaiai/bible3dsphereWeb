name: Graph entry regression

on:
  workflow_dispatch:
    inputs:
      all100:
        description: Run all100 against the deployed main source
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  cold-entry:
    name: Real Chrome graph entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cjk-font-artifact-id: ${{ steps.font-upload.outputs.artifact-id }}
      graph-artifact-id: ${{ steps.graph-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Original resource admission before install/build
        run: |
          python3 - <<'PY'
          import json,os,shutil,time
          for index in range(2):
              if index: time.sleep(10)
              start=time.monotonic()
              time.sleep(2)
              row={"load":os.getloadavg(),"cpus":os.cpu_count(),"freeBytes":shutil.disk_usage(".").free,"twoSecondSampleActualSeconds":time.monotonic()-start}
              row["loadLimit"]=min(32,4*row["cpus"])
              print(json.dumps(row),flush=True)
              assert row["load"][0]<=row["loadLimit"] and row["freeBytes"]>=2*1024**3 and row["twoSecondSampleActualSeconds"]<=3
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install verified upstream Chinese glyphs
        run: |
          mkdir -p "$RUNNER_TEMP/graph-entry-server"
          mkdir "$RUNNER_TEMP/cjk-font"
          font_upstream=https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 1 --retry-delay 1 "$font_upstream/Sans/OTC/NotoSansCJK-Regular.ttc" --output "$RUNNER_TEMP/cjk-font/NotoSansCJK-Regular.ttc"
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 1 --retry-delay 1 "$font_upstream/LICENSE" --output "$RUNNER_TEMP/cjk-font/copyright"
          printf '%s  %s\n' b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a "$RUNNER_TEMP/cjk-font/NotoSansCJK-Regular.ttc" 6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2 "$RUNNER_TEMP/cjk-font/copyright" | sha256sum --check
          install -Dm644 "$RUNNER_TEMP/cjk-font/NotoSansCJK-Regular.ttc" "$HOME/.local/share/fonts/NotoSansCJK-Regular.ttc"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' ':lang=zh-cn' | tee "$RUNNER_TEMP/graph-entry-server/cjk-font.txt"
          grep -q 'Noto Sans CJK' "$RUNNER_TEMP/graph-entry-server/cjk-font.txt"
          python3 - <<'PYFONT'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'cjk-font')
          selected=pathlib.Path(subprocess.check_output(['fc-match','-f','%{file}',':lang=zh-cn'],text=True))
          receipt={'sourceSHA':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'producerAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'upstreamCommit':'523d033d6cb47f4a80c58a35753646f5c3608a78','upstreamTag':'Sans2.004','producerSelectedFontSHA256':hashlib.sha256(selected.read_bytes()).hexdigest(),'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()}}
          assert receipt['producerSelectedFontSHA256']==receipt['files']['NotoSansCJK-Regular.ttc']
          (root/'font-source.json').write_text(json.dumps(receipt,indent=2))
          PYFONT

      - name: Preserve the actual installed font for this run
        id: font-upload
        uses: actions/upload-artifact@v4
        with:
          name: cjk-font-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cjk-font/
          if-no-files-found: error
          retention-days: 14

      - run: npm ci

      - name: Build exact PR source
        env:
          BUILD_REPRO_F7_INPUT_BASE64: ${{ secrets.BUILD_REPRO_F7_INPUT_BASE64 }}
        run: |
          npm run i18n:audit
          timeout 300s npm run build

      - name: Actual browser and source identity
        run: |
          google-chrome --version
          node --version
          git rev-parse HEAD
          git diff --exit-code
          sha256sum scripts/graph-entry-profile.mjs
          mkdir -p "$RUNNER_TEMP/graph-entry-server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          files=['src/App.jsx','src/api.js','src/MirrorPage.jsx','src/RelationshipGraphView.jsx','src/lazyWithRetry.js','scripts/graph-entry-profile.mjs','scripts/graph-entry-witness.mjs','scripts/check-graph-heading-visibility.mjs','scripts/check-home-request-cancellation.mjs','scripts/replay-historical-graph-entry.mjs','.github/workflows/graph-entry.yml','src/features/spiritual-planet/digital-human/digitalHuman.css','e2e/digital-human-repairs.spec.js']
          files+=sorted(str(p) for p in pathlib.Path('dist').rglob('*') if p.is_file())
          receipt={'checkoutSHA':git('rev-parse','HEAD'),'checkoutTree':git('rev-parse','HEAD^{tree}'),'prHeadSHA':event.get('pull_request',{}).get('head',{}).get('sha'),'files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}}
          pathlib.Path(os.environ['RUNNER_TEMP'],'graph-entry-server','source-identity.json').write_text(json.dumps(receipt,indent=2))
          PY

      - name: Real built frontend with production API
        env:
          VITE_LOCAL_API_TARGET: https://holiness.uk
          GRAPH_ENTRY_PROFILE_BASE_URL: http://127.0.0.1:4173
          GRAPH_ENTRY_PROFILE_DIR: ${{ runner.temp }}/graph-entry
        run: |
          mkdir -p "$RUNNER_TEMP/graph-entry-server"
          setsid npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/graph-entry-server/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill -- -"$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            printf 'Preview readiness probe %s/30\n' "$attempt"
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --max-time 25 http://127.0.0.1:4173/ > /dev/null
          status=0
          GRAPH_HEADING_VISIBILITY_DIR="$RUNNER_TEMP/graph-heading-visibility" timeout --kill-after=5s 300s node scripts/check-graph-heading-visibility.mjs || status=1
          CANONICAL_HTML_MODE=preview CANONICAL_HTML_BASE_URL=http://127.0.0.1:4173 CANONICAL_HTML_EVIDENCE_DIR="$RUNNER_TEMP/canonical-html-preview" timeout --kill-after=5s 120s node scripts/verify-canonical-html.mjs || status=1
          timeout 300s node scripts/graph-entry-profile.mjs || status=1
          GRAPH_ENTRY_PROFILE_DIR="$RUNNER_TEMP/graph-entry-cache-fault" GRAPH_ENTRY_PROFILE_FAULT=chunk-cache-hang timeout 300s node scripts/graph-entry-profile.mjs || status=1
          GRAPH_ENTRY_PROFILE_DIR="$RUNNER_TEMP/graph-entry-catalogue-fault" GRAPH_ENTRY_PROFILE_FAULT=catalogue-failure timeout 300s node scripts/graph-entry-profile.mjs || status=1
          GRAPH_ENTRY_PROFILE_DIR="$RUNNER_TEMP/graph-entry-portrait-fault" GRAPH_ENTRY_PROFILE_FAULT=portrait-failure timeout 300s node scripts/graph-entry-profile.mjs || status=1
          python3 - <<'PY'
          import json,os,pathlib,shutil,time
          rows=[]
          try:
              for index in range(2):
                  if index: time.sleep(10)
                  start=time.monotonic()
                  time.sleep(2)
                  row={"load":os.getloadavg(),"cpus":os.cpu_count(),"freeBytes":shutil.disk_usage(".").free,"sampleSeconds":time.monotonic()-start}
                  row["loadLimit"]=min(32,4*row["cpus"])
                  rows.append(row)
                  print(json.dumps(row),flush=True)
                  assert row["load"][0]<=row["loadLimit"] and row["freeBytes"]>=2*1024**3 and row["sampleSeconds"]<=3
          finally:
              pathlib.Path(os.environ['RUNNER_TEMP'],'graph-entry-server','conversation-layout-admission.json').write_text(json.dumps(rows))
          PY
          mkdir "$RUNNER_TEMP/conversation-layout"
          DIGITAL_HUMAN_BUBBLE_LAYOUT_ONLY=1 DIGITAL_HUMAN_REPAIR_BASE_URL=http://127.0.0.1:4173 DIGITAL_HUMAN_REPAIR_EVIDENCE_DIR="$RUNNER_TEMP/conversation-layout" PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/conversation-layout/playwright-report.json" PLAYWRIGHT_NO_COPY_PROMPT=1 timeout --kill-after=5s 300s node_modules/.bin/playwright test --config=playwright.digital-human-repairs.config.js --grep 'conversation header layout' --reporter=line,json > "$RUNNER_TEMP/conversation-layout-browser.log" 2>&1 &
          layout_pid=$!
          layout_exit=0
          wait "$layout_pid" || layout_exit=$?
          mkdir -p "$RUNNER_TEMP/conversation-layout"
          cp "$RUNNER_TEMP/conversation-layout-browser.log" "$RUNNER_TEMP/conversation-layout/browser.log"
          LAYOUT_PID="$layout_pid" LAYOUT_EXIT="$layout_exit" python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'conversation-layout')
          receipt={'executed':True,'pid':int(os.environ['LAYOUT_PID']),'exit_code':int(os.environ['LAYOUT_EXIT']),'sourceSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'command':['timeout','--kill-after=5s','300s','node_modules/.bin/playwright','test','--config=playwright.digital-human-repairs.config.js','--grep','conversation header layout','--reporter=line,json'],'baseURL':'http://127.0.0.1:4173','log':'browser.log','sha256':hashlib.sha256((root/'browser.log').read_bytes()).hexdigest()}
          receipt['gate']=json.loads((root.parent/'graph-entry-server'/'conversation-layout-admission.json').read_text())
          (root/'process-receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
          if [ "$layout_exit" -ne 0 ]; then status=1; fi
          GRAPH_LEGACY_EVIDENCE_DIR="$RUNNER_TEMP/graph-entry-legacy" timeout --kill-after=5s 300s node scripts/replay-historical-graph-entry.mjs || status=1
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            GRAPH_ENTRY_PROFILE_BASE_URL=https://holiness.uk GRAPH_ENTRY_PROFILE_DIR="$RUNNER_TEMP/graph-entry-canonical" timeout 300s node scripts/graph-entry-profile.mjs || status=1
          fi
          exit "$status"

      - name: Preserve actual successful or failed evidence
        id: graph-upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/graph-heading-visibility/
            ${{ runner.temp }}/graph-entry/
            ${{ runner.temp }}/graph-entry-cache-fault/
            ${{ runner.temp }}/graph-entry-catalogue-fault/
            ${{ runner.temp }}/graph-entry-portrait-fault/
            ${{ runner.temp }}/graph-entry-server/
            ${{ runner.temp }}/conversation-layout/
            ${{ runner.temp }}/graph-entry-legacy/
            ${{ runner.temp }}/graph-entry-canonical/
            ${{ runner.temp }}/canonical-html-preview/
            dist/assets/MirrorPage-*.js
            dist/assets/RelationshipGraphView-*.js
            dist/assets/index-*.js
            dist/assets/*.css
            dist/release-manifest.json
            dist/index.html
            dist/js/lang-init.js
            dist/js/sw-cleanup.js
          if-no-files-found: warn
          retention-days: 14

  deployment-proof:
    name: Read-only production source and health proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify current production base on PR; exact new main after merge
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FRONTEND_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          ALLOW_LEGACY_BASE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/deployment-proof
        run: python3 scripts/verify-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof/
          if-no-files-found: warn
          retention-days: 14

  canonical-html-proof:
    name: Exact raw HTML and real analytics
    if: github.ref == 'refs/heads/main'
    needs: [cold-entry, deployment-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Original resource admission before dependencies
        run: |
          python3 - <<'PY'
          import json,os,shutil,time
          for index in range(2):
              if index: time.sleep(10)
              at=time.monotonic(); time.sleep(2)
              row={'load':os.getloadavg(),'cpus':os.cpu_count(),'freeBytes':shutil.disk_usage('.').free,'sampleSeconds':time.monotonic()-at}
              row['loadLimit']=min(32,4*row['cpus']); print(json.dumps(row),flush=True)
              assert row['load'][0]<=row['loadLimit'] and row['freeBytes']>=2*1024**3 and row['sampleSeconds']<=3
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Require the actual current-run build artifact
        env:
          GRAPH_ARTIFACT_ID: ${{ needs.cold-entry.outputs.graph-artifact-id }}
        run: '[[ "$GRAPH_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.cold-entry.outputs.graph-artifact-id }}
          path: ${{ runner.temp }}/canonical-html-build
      - name: Compare original HTML bytes and actual browser analytics
        env:
          EXPECTED_FRONTEND_SHA: ${{ github.sha }}
          CANONICAL_HTML_EVIDENCE_DIR: ${{ runner.temp }}/canonical-html-production
        run: |
          html_build_directory=$(python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'canonical-html-build')
          manifests=list(root.rglob('dist/release-manifest.json'))
          assert len(manifests)==1, 'Expected one actual current-run CI dist'
          manifest=manifests[0]; value=json.loads(manifest.read_text())
          assert value['sourceCommit']==os.environ['GITHUB_SHA']
          assert hashlib.sha256((manifest.parent/'index.html').read_bytes()).hexdigest()==value['files']['index.html']
          print(manifest.parent)
          PY
          )
          export CANONICAL_HTML_EXPECTED_DIR="$html_build_directory"
          timeout --kill-after=5s 120s node scripts/verify-canonical-html.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-html-production/
          if-no-files-found: error
          retention-days: 14

  production-all100:
    name: Actual deployed main all100 mobile regression
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-all100]')) || (github.event_name == 'workflow_dispatch' && inputs.all100))
    needs: [cold-entry, native-regression, deployment-proof, canonical-html-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: digital-human-production-real-turns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Initialize campaign evidence before fallible setup
        run: |
          mkdir "$RUNNER_TEMP/digital-human-all100"
          sha256sum e2e/fixtures/digital-human-all100.json > "$RUNNER_TEMP/digital-human-all100/oracle.sha256"
      - name: Original admission before dependencies
        run: |
          python3 - <<'PY'
          import json,os,shutil,time
          for index in range(2):
              if index: time.sleep(10)
              at=time.monotonic(); time.sleep(2)
              row={'load':os.getloadavg(),'cpus':os.cpu_count(),'freeBytes':shutil.disk_usage('.').free,'sampleSeconds':time.monotonic()-at}
              row['loadLimit']=min(32,4*row['cpus']); print(json.dumps(row),flush=True)
              assert row['load'][0]<=row['loadLimit'] and row['freeBytes']>=2*1024**3 and row['sampleSeconds']<=3
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - id: install
        run: npm ci
      - name: Require this run's exact font artifact
        env:
          CJK_FONT_ARTIFACT_ID: ${{ needs.cold-entry.outputs.cjk-font-artifact-id }}
        run: '[[ "$CJK_FONT_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - name: Download this run's actual Chinese font
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.cold-entry.outputs.cjk-font-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/cjk-font
      - name: Verify and install the same font for person captures
        run: |
          python3 - <<'PYFONT'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'cjk-font')
          receipt=json.loads((root/'font-source.json').read_text())
          assert receipt['sourceSHA']==os.environ['GITHUB_SHA'] and receipt['runId']==os.environ['GITHUB_RUN_ID']
          assert 0<receipt['producerAttempt']<=int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert set(receipt['files'])=={'NotoSansCJK-Regular.ttc','copyright'}
          for name,sha in receipt['files'].items(): assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          PYFONT
          install -Dm644 "$RUNNER_TEMP/cjk-font/NotoSansCJK-Regular.ttc" "$HOME/.local/share/fonts/NotoSansCJK-Regular.ttc"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' ':lang=zh-cn' | tee "$RUNNER_TEMP/digital-human-all100/cjk-font.txt"
          grep -q 'Noto Sans CJK' "$RUNNER_TEMP/digital-human-all100/cjk-font.txt"
          python3 - <<'PYFONT'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'cjk-font')
          receipt=json.loads((root/'font-source.json').read_text())
          selected=pathlib.Path(subprocess.check_output(['fc-match','-f','%{file}',':lang=zh-cn'],text=True))
          assert hashlib.sha256(selected.read_bytes()).hexdigest()==receipt['files']['NotoSansCJK-Regular.ttc']
          receipt['selectedFontSHA256']=hashlib.sha256(selected.read_bytes()).hexdigest()
          pathlib.Path(os.environ['RUNNER_TEMP'],'digital-human-all100','cjk-font-source.json').write_text(json.dumps(receipt,indent=2))
          PYFONT
      - name: Pin canonical source immediately before the campaign
        id: source-before
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FRONTEND_SHA: ${{ github.sha }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/digital-human-all100/source-before
        run: python3 scripts/verify-release.py
      - name: Actual canonical graph and recovery
        env:
          GRAPH_ENTRY_PROFILE_BASE_URL: https://holiness.uk
        run: |
          google-chrome --version
          git rev-parse HEAD
          status=0
          for mode in none chunk-cache-hang catalogue-failure portrait-failure; do
            GRAPH_ENTRY_PROFILE_DIR="$RUNNER_TEMP/digital-human-all100/profile-$mode" GRAPH_ENTRY_PROFILE_FAULT="$mode" timeout 300s node scripts/graph-entry-profile.mjs || status=1
          done
          exit "$status"
      - name: All ten original groups, sequential real requests
        if: always() && steps.install.outcome == 'success' && steps.source-before.outcome == 'success'
        env:
          DIGITAL_HUMAN_REPAIR_BASE_URL: https://holiness.uk
        run: |
          status=0
          for group in $(seq -w 1 10); do
            GROUP="$group" python3 - <<'PY'
          import json,os,pathlib,shutil,time
          for index in range(2):
              if index: time.sleep(10)
              at=time.monotonic(); time.sleep(2)
              row={'group':os.environ['GROUP'],'at':time.time(),'load':os.getloadavg(),'cpus':os.cpu_count(),'freeBytes':shutil.disk_usage('.').free,'sampleSeconds':time.monotonic()-at}
              row['loadLimit']=min(32,4*row['cpus'])
              with pathlib.Path(os.environ['RUNNER_TEMP'],'digital-human-all100','admission.jsonl').open('a') as stream: stream.write(json.dumps(row)+'\n')
              print(json.dumps(row),flush=True)
              assert row['load'][0]<=row['loadLimit'] and row['freeBytes']>=2*1024**3 and row['sampleSeconds']<=3
          PY
            DIGITAL_HUMAN_ALL100_GROUP="$group" DIGITAL_HUMAN_ALL100_EVIDENCE_DIR="$RUNNER_TEMP/digital-human-all100/$group" timeout --kill-after=5s 300s node_modules/.bin/playwright test --config=playwright.digital-human-all100.config.js > "$RUNNER_TEMP/digital-human-all100/group-$group.log" 2>&1 &
            test_pid=$!
            code=0
            wait "$test_pid" || code=$?
            printf '{"group":"%s","pid":%s,"exit_code":%s}\n' "$group" "$test_pid" "$code" >> "$RUNNER_TEMP/digital-human-all100/processes.jsonl"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          sha256sum --check "$RUNNER_TEMP/digital-human-all100/oracle.sha256"
          exit "$status"
      - name: Pin canonical source immediately after the campaign
        if: always() && steps.install.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FRONTEND_SHA: ${{ github.sha }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/digital-human-all100/source-after
        run: python3 scripts/verify-release.py
      - name: Verify the complete new denominator
        if: always() && steps.install.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'digital-human-all100')
          oracle=json.loads(pathlib.Path('e2e/fixtures/digital-human-all100.json').read_text())
          people=[json.loads(p.read_text()) for p in root.glob('[0-9][0-9]/**/person-result.json')]
          turns=[json.loads(p.read_text()) for p in root.glob('[0-9][0-9]/**/turn-[0-2].json')]
          anchors=[json.loads(p.read_text()) for p in root.glob('[0-9][0-9]/**/anchor-*.json')]
          summary={'scope':'Current deployed-source graph recovery and all100 frozen-topic mobile regression','sourceSHA':os.environ['GITHUB_SHA'],'people':len(people),'turns':len(turns),'anchors':len(anchors),'status':'FAILED_INCOMPLETE','external':{'providers':'NOT_RUN','media':'NOT_VERIFIED','humanReview':'NOT_APPROVED'}}
          try:
              before=json.loads((root/'source-before/deployment-receipt.json').read_text())
              after=json.loads((root/'source-after/deployment-receipt.json').read_text())
              assert before['status']==after['status']=='PASS' and before['sourceBound'] and after['sourceBound']
              assert before['expectedFrontendSHA']==after['expectedFrontendSHA']==os.environ['GITHUB_SHA']
              assert before['canonical']==after['canonical'] and before['backend']['spaceSHA']==after['backend']['spaceSHA'] and before['backend']['sourceFiles']==after['backend']['sourceFiles']
              for mode in ['none','chunk-cache-hang','catalogue-failure','portrait-failure']:
                  profile=json.loads((root/f'profile-{mode}'/'profile-data.json').read_text())
                  assert profile['status']=='ENTRY_PASSED_ROOT_UNRESOLVED' and len(profile['results'])==2
                  assert all(r['originalFiveSecondAssertion']=='PASS' and r['graphDataStatus']=='PASS' for r in profile['results'])
                  assert all(r['portrait']['status']=='PASS' and r['portrait']['http']['status']==200 for r in profile['results'])
                  if mode=='portrait-failure': assert all(r['portraitRetry']=='PASS' and r['injectedFailures']==1 for r in profile['results'])
              assert len(people)==100 and {p['characterId'] for p in people}=={p['characterId'] for p in oracle['characters']}
              assert all(p['completed'] and len(p['steps'])==3 and all(s['matched'] for s in p['steps']) for p in people)
              assert len(turns)==300 and len(anchors)==10
              all_turns=turns+anchors
              assert all(t['http']==200 and t['body']['state']=='TEXT_ONLY' and t['body']['response']['contentReviewState']=='THEOLOGY_REVIEW' and t['body']['response']['speechApproved'] is False for t in all_turns)
              assert len({t['body']['turnId'] for t in all_turns})==310
              assert len({t['body']['traceId'] for t in all_turns})==310
              assert all(t['characterId']==t['request']['characterId']==t['body']['response']['characterId'] and t['request']['sessionId']==t['body']['sessionId'] and (not t['request'].get('turnId') or t['request']['turnId']==t['body']['turnId']) for t in all_turns)
              processes=[json.loads(line) for line in (root/'processes.jsonl').read_text().splitlines()]
              assert len(processes)==10 and all(p['pid']>0 and p['exit_code']==0 for p in processes)
              assert {p['group'] for p in processes}=={f'{g:02d}' for g in range(1,11)}
              for group in range(1,11):
                  stats=json.loads((root/f'{group:02d}'/'playwright-report.json').read_text())['stats']
                  assert stats['expected']==10 and stats['unexpected']==stats['skipped']==stats['flaky']==0
              assert len(list(root.glob('[0-9][0-9]/**/header-layout.json')))==100
              portraits=[json.loads(p.read_text()) for p in root.glob('[0-9][0-9]/**/portraits.json')]
              assert len(portraits)==100 and len({p['characterId'] for p in portraits})==100
              assert len({p['http']['sha256'] for p in portraits})==100
              assert all(p['status']=='PASS' and p['http']['status']==200 and p['http']['sha256']==p['expected']['sha256'] and len(p['surfaces'])==2 and all(s['decoded'] and s['characterId']==p['characterId'] for s in p['surfaces']) for p in portraits)
              assert len(list(root.glob('[0-9][0-9]/**/portrait-list.json')))==100
              for path in root.glob('[0-9][0-9]/**/header-layout.json'):
                  layout=json.loads(path.read_text())
                  assert layout['headingWidth']>=200 and layout['badgeLeft']>=layout['sectionLeft'] and layout['badgeRight']<=min(layout['sectionRight'],layout['viewportWidth'])
                  assert all(layout[a]<=layout[b] for a,b in [('badgeScrollWidth','badgeClientWidth'),('headerScrollWidth','headerClientWidth'),('titleScrollWidth','titleClientWidth'),('documentWidth','viewportWidth')])
              assert len(list(root.glob('[0-9][0-9]/**/entry.png')))==len(list(root.glob('[0-9][0-9]/**/followups.png')))==100
              summary.update(status='PASS',matching=100,followups=200,switches=100,layouts=100,uniqueArtisticPortraits=100,screenshots=200,acceptedTurnPOSTs=310)
          except BaseException as error:
              summary.update(errorType=type(error).__name__,error=str(error),uncompletedPeople=100-len([p for p in people if p['completed']]))
              raise
          finally:
              (root/'summary.json').write_text(json.dumps(summary,indent=2))
              files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.name!='manifest.json'}
              (root/'manifest.json').write_text(json.dumps(files,indent=2))
              print(json.dumps(summary),flush=True)
          PY
      - name: Retain all actual successful and failed evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-all100-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digital-human-all100/
          # Task-owned root has no auth storage; retain the ten .last-run.json
          # receipts too, so the downloaded bytes match the complete manifest.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  native-regression:
    name: Fresh full regression within original 300 seconds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Original resource admission before dependencies
        run: |
          python3 - <<'PY'
          import json,os,shutil,time
          for index in range(2):
              if index: time.sleep(10)
              start=time.monotonic(); time.sleep(2)
              row={"load":os.getloadavg(),"cpus":os.cpu_count(),"freeBytes":shutil.disk_usage('.').free,"sampleSeconds":time.monotonic()-start}
              row['loadLimit']=min(32,4*row['cpus'])
              print(json.dumps(row),flush=True)
              assert row['load'][0]<=row['loadLimit'] and row['freeBytes']>=2*1024**3 and row['sampleSeconds']<=3
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Pinned real backend and native dependencies
        run: |
          git init "$RUNNER_TEMP/backend"
          git -C "$RUNNER_TEMP/backend" remote add origin https://github.com/zpcaiai/bible3dsphere.git
          git -C "$RUNNER_TEMP/backend" fetch --depth 1 origin bfced56f00daf2fdffcbe1a6888c6d2fa6f8004c
          git -C "$RUNNER_TEMP/backend" checkout --detach FETCH_HEAD
          python -m pip install 'pytest>=7.4,<9' 'pytest-asyncio>=0.21,<0.24' 'uvicorn[standard]==0.32.1' 'fastapi==0.115.6' 'pydantic>=2.10,<3' 'httpx>=0.27,<0.29' 'jsonschema>=4.20,<5' 'PyYAML>=6.0.2,<7' 'cryptography>=42,<46' 'PyJWT>=2.8,<3' 'slowapi>=0.1.9,<0.2' 'bcrypt>=4,<5' 'livekit-agents>=1.8.2,<1.9.0' numpy requests psycopg2-binary
          PYTHONPATH="$RUNNER_TEMP/backend/backend" python -m pytest --noconftest --collect-only -q "$RUNNER_TEMP/backend/backend/tests"/test_digital_human*.py
      - name: Actual full frontend, backend, lint and build
        env:
          BUILD_REPRO_F7_INPUT_BASE64: ${{ secrets.BUILD_REPRO_F7_INPUT_BASE64 }}
          REGRESSION_BACKEND_DIR: ${{ runner.temp }}/backend
          REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/native-regression
        run: timeout 300s python scripts/full-regression.py
      - name: Real Chrome cancellation of owned home API requests
        env:
          HOME_REQUEST_CANCEL_DIR: ${{ runner.temp }}/native-regression/home-request-cancellation
        run: timeout --kill-after=5s 300s node scripts/check-home-request-cancellation.mjs
      - name: Retain source, process and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-regression/
          if-no-files-found: warn
          retention-days: 14
